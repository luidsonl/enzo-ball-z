[workspace]
resolver = "2"
members = ["crates/enzo-core", "crates/enzo-sim", "crates/enzo-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Luidson Lima"]

[workspace.dependencies]
enzo-core = { path = "crates/enzo-core" }
macroquad = "0.4.16"
quad-storage = "0.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
