<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EnzoBallZ</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body,
      canvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: absolute;
        background: #10101c;
        z-index: 0;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #e8e8ff;
        font: 16px/1.5 system-ui, sans-serif;
        z-index: 1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="loading">Loading EnzoBallZ…</div>

    <div id="dom-ui" aria-hidden="false"></div>

    <script>
      // The bundle includes the quad_net plugin, which references register_plugin
      // before sapp_jsutils.js defines it. The game does not use networking; this
      // stub avoids a harmless console error.
      var register_plugin = function () {};
      // Prevent WebGL buffer loss/black flashes when async asset downloads yield.
      (function () {
        var c = document.getElementById("glcanvas");
        if (!c) return;
        var orig = c.getContext.bind(c);
        c.getContext = function (type, attrs) {
          if (type === "webgl" || type === "webgl2" || type === "experimental-webgl") {
            attrs = Object.assign({ preserveDrawingBuffer: true }, attrs || {});
          }
          return orig(type, attrs);
        };
      })();
    </script>
    <!-- Relative paths work locally and on GitHub Pages project subpaths. -->
    <script src="./mq_js_bundle.js" data-vite-ignore></script>
    <script src="./sapp_jsutils.js" data-vite-ignore></script>
    <script src="./quad-storage.js" data-vite-ignore></script>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Macroquad does not notify the HTML when the first frame is ready. The
      // canvas starts at 300x150 and is resized by wasm at startup; use that as
      // a signal to remove the loading overlay.
      const loading = document.getElementById("loading");
      const gameCanvas = document.getElementById("glcanvas");
      const startedAt = performance.now();

      function hideWhenReady() {
        if (gameCanvas.width > 300 || gameCanvas.height > 150) {
          requestAnimationFrame(() => loading.remove());
          return;
        }
        if (performance.now() - startedAt > 15000) {
          loading.textContent =
            "The game took too long to load. Check the browser console.";
          return;
        }
        requestAnimationFrame(hideWhenReady);
      }

      if (typeof load !== "undefined") load("enzo-wasm.wasm");
      requestAnimationFrame(hideWhenReady);
    </script>
  </body>
</html>
