<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnzoBallZ</title>
    <style>
      html,
      body,
      canvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: absolute;
        background: #10101c;
        z-index: 0;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #e8e8ff;
        font: 16px/1.5 system-ui, sans-serif;
        z-index: 1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="loading">Carregando EnzoBallZ…</div>
    <script>
      // O bundle inclui o plugin quad_net, que referencia `register_plugin`
      // antes de sapp_jsutils.js defini-lo. O jogo não usa rede; o stub evita
      // um erro inofensivo no console.
      var register_plugin = function () {};
    </script>
    <script src="mq_js_bundle.js"></script>
    <script src="sapp_jsutils.js"></script>
    <script src="quad-storage.js"></script>
    <script>
      // O macroquad não avisa o HTML quando o primeiro frame está pronto. O
      // canvas começa em 300x150 e é redimensionado pelo wasm ao iniciar; usar
      // isso como sinal evita deixar o overlay "Carregando" por cima do jogo.
      const loading = document.getElementById("loading");
      const gameCanvas = document.getElementById("glcanvas");
      const startedAt = performance.now();

      function hideWhenReady() {
        if (gameCanvas.width > 300 || gameCanvas.height > 150) {
          requestAnimationFrame(() => loading.remove());
          return;
        }
        if (performance.now() - startedAt > 15000) {
          loading.textContent =
            "O jogo demorou para carregar. Verifique o console do navegador.";
          return;
        }
        requestAnimationFrame(hideWhenReady);
      }

      load("enzo-wasm.wasm");
      requestAnimationFrame(hideWhenReady);
    </script>
  </body>
</html>
